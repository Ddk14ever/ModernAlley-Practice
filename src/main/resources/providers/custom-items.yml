# First-pass custom item/weapon settings. Values are intentionally easy to tune.
special-golden-apple:
  material: GOLDEN_APPLE
  name: "&6&lSpecial Golden Apple"
  lore:
    - "&7Golden Head effects without Speed."

ak47:
  # SHEARS supplies a visible durability bar without a vanilla use/FOV
  # state. The resource pack replaces its model through item_model.
  material: SHEARS
  # Only the AK-47 receives this model id; normal bows are untouched.
  custom-model-data: 14001
  name: "&7&lAK-47"
  lore:
    - "&8Hold right-click to fire automatically."
    - "&8Use the off-hand swap key as reload."
  magazine-size: 30
  shots-per-second: 10.0
  damage: 10.0
  projectile-speed: 3.0
  spread: 0.03
  reload-ticks: 36
  switch-ticks: 20
  attack-speed: 0.833333
  trail-particle: FLAME
  muzzle-particle: SMOKE

awp:
  # DIAMOND_HOE base: not a "usable" item, so the client never enters an
  # item-use state (which would suppress left-click). The AWP model comes from
  # item_model, and the hoe's durability bar shows the ammo. Scoping wears a
  # pumpkin (telescope-lens overlay) and applies Slowness II while preserving
  # normal client movement.
  material: DIAMOND_HOE
  # Only the AWP receives this model id; normal hoes are untouched.
  custom-model-data: 14002
  name: "&6&lAWP"
  lore:
    - "&8Right-click to scope."
    - "&8Left-click to fire one shot (scoped or unscoped)."
  magazine-size: 5
  damage: 30.0
  # Unused: the AWP is hitscan (ray-traced), so projectile speed does not apply.
  projectile-speed: 8.0
  reload-ticks: 50
  switch-ticks: 20
  shot-cooldown-ticks: 24
  attack-speed: 0.833333
  # Retained for configuration compatibility. Scope visual/movement behavior
  # is controlled by the pumpkin overlay and Slowness II.
  scope-fov: 20

grappling-hook:
  # Uses the vanilla fishing-rod model. The persistent id makes only this rod
  # use the grappling behavior; normal fishing rods remain unchanged.
  material: FISHING_ROD
  name: "&b&lHook"
  lore:
    - "&8右键抛出钩子。"
    - "&8再次右键收回并向钩子方向加速。"
  # Final speed = base-speed + hook-distance * distance-speed.
  base-speed: 0.5
  distance-speed: 1.0
  max-speed: 3.0
  min-distance: 4.0
  max-lifetime-ticks: 200
